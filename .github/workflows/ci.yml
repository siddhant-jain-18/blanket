name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: use the runner's system python3 here, NOT setup-python:
      # python3-evdev comes from apt and is only importable by
      # /usr/bin/python3. An isolated setup-python interpreter cannot see
      # apt site-packages, which fails with "No module named 'evdev'".
      - name: Install test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-evdev
          /usr/bin/python3 -c 'import evdev; print("evdev ok")'

      - name: Show interpreter versions
        run: |
          /usr/bin/python3 --version
          which python3 || true

      - name: Compile check (watcher + completions sanity)
        run: |
          /usr/bin/python3 -m py_compile blanket-watcher.py
          bash -n blanket.sh
          bash -n install.sh
          bash -n uninstall.sh

      - name: Run watcher unit tests
        run: timeout 120 /usr/bin/python3 -m unittest discover -s tests -v
