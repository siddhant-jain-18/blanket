name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-evdev
          python3 -c 'import evdev; print("evdev ok")'

      - name: Compile check (watcher + completions sanity)
        run: |
          python3 -m py_compile blanket-watcher.py
          bash -n blanket.sh
          bash -n install.sh
          bash -n uninstall.sh

      - name: Run watcher unit tests
        run: timeout 120 python3 -m unittest discover -s tests -v
